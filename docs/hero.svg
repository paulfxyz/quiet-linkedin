<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">Quiet, LinkedIn!</title>
  <desc id="desc">A quiet blue and white project banner with a muted bell, Home and Notifications icons, and a zero-inbox motif. This is a project illustration, not a LinkedIn screenshot.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101f31"/><stop offset="1" stop-color="#0e3048"/></linearGradient>
    <linearGradient id="tile" x2="0" y2="1"><stop stop-color="#0a75da"/><stop offset="1" stop-color="#0a66c2"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".025"/></pattern>
  </defs>
  <rect width="1600" height="560" rx="28" fill="url(#bg)"/>
  <rect width="1600" height="560" rx="28" fill="url(#grid)"/>
  <circle cx="1360" cy="160" r="270" fill="#3296ff" opacity=".055"/>
  <circle cx="1360" cy="160" r="210" fill="none" stroke="#64b5ff" opacity=".08"/>
  <g transform="translate(90 88)">
    <rect width="72" height="72" rx="20" fill="url(#tile)"/>
    <path d="M21 46h30l-4-6V29c0-15-22-15-22 0v11zm10 6c0 7 10 7 10 0" fill="#fff"/>
    <path d="M17 17l38 38" stroke="#0a66c2" stroke-width="10"/>
    <path d="M17 17l38 38" stroke="#fff" stroke-width="4"/>
    <text x="94" y="30" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#7fc7ff">CSS ONLY</text>
    <text x="94" y="59" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#c5d6e6">HOME + NOTIFICATIONS</text>
  </g>
  <text x="88" y="284" font-family="Arial,Helvetica,sans-serif" font-size="86" font-weight="700" letter-spacing="-3" fill="#fff">Quiet, LinkedIn!</text>
  <text x="92" y="346" font-family="Arial,Helvetica,sans-serif" font-size="32" fill="#b5cadf">Zero inbox. Two fewer badges.</text>
  <g transform="translate(92 424)" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">
    <rect width="110" height="38" rx="19" fill="#193c52" stroke="#2b576f"/>
    <text x="55" y="25" text-anchor="middle" fill="#b5ead7">MIT</text>
    <rect x="122" width="162" height="38" rx="19" fill="#193c52" stroke="#2b576f"/>
    <text x="203" y="25" text-anchor="middle" fill="#c7dded">MANIFEST V3</text>
    <rect x="296" width="174" height="38" rx="19" fill="#193c52" stroke="#2b576f"/>
    <text x="383" y="25" text-anchor="middle" fill="#c7dded">NO TRACKING</text>
  </g>
  <g transform="translate(1036 176)">
    <rect width="464" height="210" rx="24" fill="#fff" fill-opacity=".045" stroke="#fff" stroke-opacity=".12"/>
    <g transform="translate(80 50)" fill="#e7f1fb">
      <path d="M0 28 28 4 56 28v32H36V42H20v18H0Z"/>
      <text x="28" y="98" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17">Home</text>
    </g>
    <path d="M232 38v128" stroke="#fff" stroke-opacity=".13"/>
    <g transform="translate(324 50)" fill="#e7f1fb">
      <path d="M0 53h56l-8-11V24C48-2 8-2 8 24v18zm18 8c0 14 20 14 20 0"/>
      <text x="28" y="98" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17">Notifications</text>
    </g>
  </g>
