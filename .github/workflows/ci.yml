name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run package
      - name: Verify the packaged extension
        run: |
          VERSION="$(node -p "require('./manifest.json').version")"
          QUIET_EXTENSION_DIR="$PWD/dist/quiet-linkedin-v$VERSION" npm test
      - uses: actions/upload-artifact@v4
        with:
          name: quiet-linkedin
          path: dist/*.zip
